name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax checks
        run: python -m py_compile scripts/generate_reports.py scripts/sync_worker_history.py tests/test_sync_worker_history.py

      - name: Python unit tests
        run: python -m unittest tests.test_sync_worker_history

      - name: Worker syntax check
        run: node --check cloudflare/src/worker.js

      - name: Worker helper tests
        run: node tests/test_worker_helpers.mjs
